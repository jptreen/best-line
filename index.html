<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best Line — a dice probability puzzle</title>
<style>
  /* One dial the whole board is measured in. Change --cell and every die,
     arrow, gap and font size follows. Chunk 2 will set it from the screen
     size; for now it is the 68px the board has always used. */
  :root {
    --cell: 68px;
    --gap:   calc(var(--cell) * 0.09);   /* 6px  at 68 */
    --arrow: calc(var(--cell) * 0.65);   /* 44px at 68 */
    --pick:  calc(var(--cell) * 0.59);   /* 40px at 68 */
    --n: 5;                              /* columns of dice — set by draw() */
    --hud-space: 96px;                   /* room kept for the pinned HUD */
  }

  body {
    background: #14161a; color: #e6e6e6; margin: 0; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 20px; }

  /* The opening screen. Covers everything until START is pressed — which is
     also when the clock starts, so nobody is timed while reading the rules. */
  .modal {
    position: fixed; inset: 0; z-index: 20; background: #14161a;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal[hidden] { display: none; }
  .card { max-width: 420px; text-align: center; }
  .card h2 { font-size: 30px; font-weight: 600; margin: 0 0 16px; }
  .card p { color: #8a94a6; font-size: 15px; line-height: 1.6; margin: 0 0 26px; }
  #startBtn {
    padding: 13px 42px; border-radius: 8px; cursor: pointer; font-size: 17px;
    background: #59c67f; color: #10141a; border: none;
    font-weight: 700; letter-spacing: 0.06em;
  }
  .board {
    display: grid;
    grid-template-columns: var(--arrow) repeat(var(--n), var(--cell)) var(--arrow);
    gap: var(--gap); align-items: center; justify-items: center;
  }
  .cell {
    width: var(--cell); height: var(--cell);
    border-radius: calc(var(--cell) * 0.118);
    background: #232833; border: 2px solid #2e3542;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .value { font-size: calc(var(--cell) * 0.382); font-weight: 700; line-height: 1; }
  .sides {
    font-size: calc(var(--cell) * 0.162); color: #808b9e;
    margin-top: calc(var(--cell) * 0.059);
  }
  /* The reveal: each die in the chosen line pops in turn, green or red. */
  .cell.step { animation: pop 0.3s ease-out; }
  .cell.good { border-color: #59c67f; background: #1e3326; }
  .cell.bad  { border-color: #e8695f; background: #33201e; }
  .cell.win  {
    border-color: #59c67f; background: #1e3326;
    box-shadow: 0 0 0 3px rgba(89, 198, 127, 0.25);
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  button.pick {
    width: var(--pick); height: var(--pick);
    border-radius: calc(var(--cell) * 0.088); cursor: pointer;
    background: #262c38; color: #b9c2d0; border: 1px solid #38404f;
    font-size: calc(var(--cell) * 0.235); font-weight: 600;
  }
  button.pick:hover:not(:disabled) { background: #333b4a; color: #fff; }
  button.pick:disabled { cursor: default; opacity: 0.45; }
  button.pick.chosen { background: #f0a03c; color: #14161a; border-color: #f0a03c; }
  button.pick.best { outline: 2px solid #59c67f; outline-offset: 1px; }
  /* .play holds the board and the info block. A column on desktop and in
     portrait (board, then result and odds below); a row in landscape, with
     the info block moved to the left of the board. */
  .play { display: flex; flex-direction: column; align-items: center; }
  .info { display: flex; flex-direction: column; align-items: center; }

  .result { margin-top: 20px; min-height: 26px; font-size: 17px; text-align: center; }
  .right { color: #59c67f; } .wrong { color: #e8695f; }
  .odds { margin-top: 12px; font-size: 13px; color: #8a94a6; text-align: center; line-height: 1.7; }
  .odds b { color: #e6e6e6; font-weight: 600; }
  /* Each line's odds is its own span so landscape can stack them one per
     row. The separator is added by CSS, so it disappears when they stack. */
  .oddline:not(:last-child)::after { content: ' · '; color: #5a6478; }
  /* Before you answer, the same block is rendered with dummy numbers and
     made invisible — the space is already claimed, so the board can't jump
     the moment the real odds appear. */
  .odds.ghost { visibility: hidden; }
  .bar { margin-top: 18px; display: flex; gap: 16px; align-items: center; }
  #next {
    padding: 9px 18px; border-radius: 6px; cursor: pointer; font-size: 15px;
    background: #59c67f; color: #10141a; border: none; font-weight: 600;
  }
  #next[hidden] { display: none; }
  #game { display: flex; flex-direction: column; align-items: center; }
  #game[hidden] { display: none; }

  /* The scoreboard: round counter and running total, kept deliberately big.
     .hudwrap holds the tiles and the pips together so both can be pinned
     as one block on small screens. */
  .hudwrap { display: flex; flex-direction: column; align-items: center; }
  .hud { display: flex; gap: 14px; margin-bottom: 10px; }
  .tile {
    background: #1c212b; border: 1px solid #2e3542; border-radius: 8px;
    padding: 8px 16px; text-align: center; min-width: 104px;
  }
  .tile .big { font-size: 28px; font-weight: 700; line-height: 1.1; }
  .tile .big.good { color: #59c67f; }
  .tile .lab {
    font-size: 11px; color: #808b9e; margin-top: 3px;
    text-transform: uppercase; letter-spacing: 0.07em;
  }

  /* One pip per round — green hit, red miss, grey not played yet. */
  .pips { display: flex; gap: 4px; margin-bottom: 18px; }
  .pip {
    width: 13px; height: 13px; border-radius: 3px;
    background: #262c38; border: 1px solid #333b4a;
  }
  .pip.hit { background: #59c67f; border-color: #59c67f; }
  .pip.miss { background: #e8695f; border-color: #e8695f; }

  /* Toast: slides in at the top when the difficulty steps up, then fades. */
  .toastwrap {
    position: fixed; top: 16px; left: 0; right: 0;
    display: flex; justify-content: center; pointer-events: none; z-index: 10;
  }
  .toast {
    background: #2a2118; border: 1px solid #f0a03c; color: #f5c27d;
    padding: 11px 20px; border-radius: 8px; font-size: 14px; max-width: 80%;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    opacity: 0; transform: translateY(-14px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  .final { text-align: center; margin-top: 30px; }
  .final[hidden] { display: none; }
  .final .num { font-size: 68px; font-weight: 700; color: #59c67f; line-height: 1; }
  .final .outof { color: #8a94a6; font-size: 15px; margin-top: 6px; }
  #playAgain {
    margin-top: 24px; padding: 9px 18px; border-radius: 6px; cursor: pointer;
    font-size: 15px; background: #59c67f; color: #10141a; border: none; font-weight: 600;
  }

  /* The shareable. Emoji squares are plain text, not an image — which is
     why the result pastes into any chat app with nothing attached. */
  .share {
    margin-top: 22px; background: #1c212b; border: 1px solid #2e3542;
    border-radius: 8px; padding: 14px 18px; max-width: 92vw;
    font-size: 15px; color: #b9c2d0; line-height: 1.6;
  }
  .share .squares {
    font-size: 21px; letter-spacing: 3px; line-height: 1.35; margin: 8px 0 6px;
  }
  .share .link { font-size: 12px; color: #808b9e; word-break: break-all; }
  .sharebtns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .sharebtns button {
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
    background: #262c38; color: #b9c2d0; border: 1px solid #38404f; font-weight: 600;
  }
  .sharebtns button:hover { background: #333b4a; color: #fff; }
  .sharebtns button[hidden] { display: none; }

  /* ---- Tablet and smaller (1024px or less) --------------------------------
     The HUD stops scrolling with the page and is pinned: across the top in
     portrait, down the right-hand side in landscape. Everything else is
     inset so nothing ends up hidden underneath it. */

  @media (max-width: 1024px) and (orientation: portrait) {
    body { padding: 10px; padding-top: calc(var(--hud-space) + 10px); }
    h1 { font-size: 18px; margin-bottom: 12px; }

    .hudwrap {
      position: fixed; top: 0; left: 0; right: 0; z-index: 5;
      background: #14161a; padding: 8px 10px 7px;
      border-bottom: 1px solid #232833;
    }
    .hud { gap: 6px; margin-bottom: 7px; width: 100%; }
    .tile { min-width: 0; flex: 1; padding: 5px 4px; }
    .tile .big { font-size: 20px; }
    .tile .lab { font-size: 9px; margin-top: 2px; }
    .hudwrap .pips { margin-bottom: 0; }

    /* Keep the toast clear of the pinned bar. */
    .toastwrap { top: calc(var(--hud-space) + 16px); }
  }

  @media (max-width: 1024px) and (orientation: landscape) {
    body { padding: 8px; padding-right: 118px; }
    /* The HUD lives inside #game, so it vanishes on the end screen — the
       gap it was reserving should go with it. */
    body.ended { padding-right: 8px; }
    h1 { font-size: 16px; margin-bottom: 8px; }

    .hudwrap {
      position: fixed; top: 8px; right: 8px; bottom: 8px; width: 102px;
      z-index: 5; justify-content: flex-start;
    }
    /* flex: 1 makes the tiles claim the height left over after the pips, so
       the pips stay anchored at the bottom. flex-start then packs the tiles
       at the top of that space, which puts all the slack in one place — the
       gap between the score tiles and the pips. */
    .hud {
      flex: 1; justify-content: flex-start;
      flex-direction: column; gap: 6px; width: 100%; margin-bottom: 8px;
    }
    .tile { min-width: 0; width: 100%; padding: 4px 6px; }
    .tile .big { font-size: 19px; }
    .tile .lab { font-size: 9px; margin-top: 1px; }

    /* 12 pips as 6 across, 2 down. Scoped to the HUD so the end screen's
       row of pips is left alone. */
    .hudwrap .pips {
      display: grid; grid-template-columns: repeat(6, 13px);
      justify-content: center; gap: 4px; margin-bottom: 0; width: 100%;
    }

    .toastwrap { right: 118px; }

    /* Three zones: odds on the left, board in the middle, HUD on the right.
       The info column is a fixed width so the board's share of the width is
       known — otherwise each would be waiting on the other to be measured. */
    .play { flex-direction: row; align-items: center; gap: 10px; }
    .info {
      order: -1; width: 150px; flex: none;
      align-items: flex-start; max-height: 100%; overflow-y: auto;
    }
    .result { margin-top: 0; font-size: 14px; text-align: left; }
    .odds { margin-top: 8px; font-size: 11px; line-height: 1.5; text-align: left; }
    .oddline { display: block; }
    .oddline:not(:last-child)::after { content: none; }
    .bar { margin-top: 10px; }
    #next { padding: 7px 12px; font-size: 13px; }
  }
</style>

<div class="toastwrap"><div class="toast" id="toast"></div></div>

<div class="modal" id="startModal">
  <div class="card">
    <h2>Best Line</h2>
    <p>
      Pick the row, column or diagonal most likely to come up all-matching if
      you re-rolled it. Dice already showing the target number are kept — only
      the mismatched ones re-roll.
    </p>
    <button id="startBtn">START</button>
  </div>
</div>

<h1>Best Line</h1>

<div id="game" hidden>
  <div class="hudwrap">
    <div class="hud">
      <div class="tile"><div class="big" id="roundNum">1 of 12</div><div class="lab">Round</div></div>
      <div class="tile"><div class="big good" id="correctNum">0</div><div class="lab">Correct</div></div>
      <div class="tile"><div class="big" id="boardNum">4×4</div><div class="lab">Board</div></div>
      <div class="tile"><div class="big" id="timeNum">0:00</div><div class="lab">Time</div></div>
    </div>
    <div class="pips" id="pips"></div>
  </div>

  <div class="play">
    <div class="board" id="board"></div>
    <div class="info">
      <div class="result" id="result"></div>
      <div class="odds" id="odds"></div>
      <div class="bar">
        <button id="next" hidden>Next board</button>
      </div>
    </div>
  </div>
</div>

<div class="final" id="final" hidden>
  <div class="num" id="finalNum">0</div>
  <div class="outof" id="finalOutOf"></div>
  <div class="outof" id="finalTime"></div>
  <div class="pips" id="finalPips" style="justify-content: center"></div>

  <div class="share" id="share" role="img" aria-label=""></div>
  <div class="sharebtns">
    <button id="copyBtn">Copy</button>
    <button id="shareBtn" hidden>Share</button>
  </div>

  <button id="playAgain">Play again</button>
</div>

<script>
  // Which dice can appear, by round — three phases of four. Early rounds stay
  // simple; the last four bring in d4 and d20, where the odds swing hardest.
  function dicePool(round) {
    if (round <= 4) return [8, 10];
    if (round <= 10) return [6, 8, 10, 12];
    return [4, 6, 8, 10, 12, 20];
  }

  // Board size by round: 4x4 to start (four in a line), 5x5 from round 9.
  function gridSize(r) { return r <= 8 ? 4 : 5; }

  // The lines for an n-by-n board: n rows, n columns, 2 diagonals — so ten
  // lines at 4x4 and twelve at 5x5. Each is a list of [row, col] positions.
  function buildLines(n) {
    const idx = [];
    for (let i = 0; i < n; i++) idx.push(i);
    const lines = [];
    for (let r = 0; r < n; r++) lines.push({ key: 'R' + (r + 1), cells: idx.map(c => [r, c]) });
    for (let c = 0; c < n; c++) lines.push({ key: 'C' + (c + 1), cells: idx.map(r => [r, c]) });
    lines.push({ key: 'D↘', cells: idx.map(i => [i, i]) });
    lines.push({ key: 'D↙', cells: idx.map(i => [i, n - 1 - i]) });
    return lines;
  }

  const TOTAL_ROUNDS = 12;

  // Where the game lives online. Change this one line if the address moves.
  const SHARE_URL = 'https://jptreen.github.io/best-line/';

  let grid, round = 1, correct = 0, answered = false;
  let size = gridSize(1);
  let LINES = buildLines(size);
  let results = [];   // results[i] is true/false once round i+1 has been played

  // Every delayed step of the reveal animation, so an early "Next board"
  // can cancel them. Left running, they would paint the *next* board.
  let pending = [];
  function clearPending() {
    pending.forEach(clearTimeout);
    pending = [];
  }

  // The clock. Starts on the first pick, not on page load.
  // finalMs freezes the elapsed time when the game ends. Without it, the
  // share text would recompute from the clock and report a longer game the
  // longer you sat on the end screen before pressing Copy.
  let startMs = null, tickHandle = null, finalMs = 0;

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function showTime() {
    document.getElementById('timeNum').textContent =
      fmt(startMs === null ? 0 : Date.now() - startMs);
  }
  function startClock() {
    if (startMs !== null) return;
    startMs = Date.now();
    tickHandle = setInterval(showTime, 250);
  }
  function stopClock() {
    clearInterval(tickHandle);
    tickHandle = null;
  }

  // Toast. Kept separate from `pending` — skipping a reveal shouldn't
  // swallow a difficulty warning.
  let toastHandle = null;
  function toast(message) {
    const t = document.getElementById('toast');
    t.textContent = message;
    t.classList.add('show');
    clearTimeout(toastHandle);
    toastHandle = setTimeout(() => t.classList.remove('show'), 3500);
  }
  function hideToast() {
    clearTimeout(toastHandle);
    document.getElementById('toast').classList.remove('show');
  }

  // Work out what got harder between two rounds by comparing them, rather
  // than hard-coding the round numbers — so the messages can't go stale if
  // the ramp moves again.
  function stepUpMessage(from, to) {
    const parts = [];
    if (gridSize(to) !== gridSize(from)) {
      parts.push('The board grows to ' + gridSize(to) + '×' + gridSize(to) +
                 ' — a winning line now needs ' + gridSize(to) + ' matching dice.');
    }
    const added = dicePool(to).filter(d => !dicePool(from).includes(d));
    if (added.length) {
      parts.push('New dice in play: ' + added.map(d => 'd' + d).join(' and ') + '.');
    }
    return parts.join(' ');
  }

  function roll(sides) { return 1 + Math.floor(Math.random() * sides); }

  // How many dice a single line may already show matching before the board
  // is thrown away. A line that already holds three of a kind is findable by
  // eye, which lets you skip the probability reasoning the game is about.
  // Rounds 1-4 allow anything, so the puzzle can be learned before it bites.
  //
  // Measured over 8,000 accepted boards per round: banning 4+ leaves the
  // best line about 1.7-2x better than the runner-up, banning 3+ narrows
  // that to ~1.3x. Banning 2+ was tried and dropped — only 1 board in 85,000
  // qualifies at 5x5, so the re-deal cap would swallow the rule entirely.
  function banFrom(r) {
    if (r <= 4) return Infinity;   // no limit
    if (r <= 6) return 4;
    if (r <= 8) return 3;
    if (r <= 11) return 4;
    return 3;
  }

  // True when no line already shows banFrom(round) or more of one number.
  function noGiveawayLine() {
    const limit = banFrom(round);
    if (limit === Infinity) return true;
    for (const line of LINES) {
      const counts = {};
      for (const [r, c] of line.cells) {
        const v = grid[r][c].value;
        counts[v] = (counts[v] || 0) + 1;
        if (counts[v] >= limit) return false;
      }
    }
    return true;
  }

  // True when exactly one line is the best — no joint winners.
  function hasUniqueBest() {
    const ps = LINES.map(l => lineProbability(l));
    const best = Math.max.apply(null, ps);
    return ps.filter(p => p >= best - 1e-12).length === 1;
  }

  // Deal boards until one has a single clear winner. Capped at 300 tries so a
  // stubborn round can never hang the game; past that we accept a tie and the
  // joint-winner handling below copes with it.
  function newGrid() {
    const pool = dicePool(round);
    size = gridSize(round);
    LINES = buildLines(size);

    for (let attempt = 0; attempt < 300; attempt++) {
      grid = [];
      for (let r = 0; r < size; r++) {
        const row = [];
        for (let c = 0; c < size; c++) {
          const sides = pool[Math.floor(Math.random() * pool.length)];
          row.push({ sides: sides, value: roll(sides) });
        }
        grid.push(row);
      }
      // Cheap test first — no point pricing every line on a board we are
      // about to throw away anyway.
      if (noGiveawayLine() && hasUniqueBest()) return;
    }
  }

  // The best chance this line has of ending up all showing the same number.
  //
  // You commit to ONE target number, keep the dice already showing it, and
  // re-roll the rest. So a line is worth its *best available target* — not the
  // sum of every target, because you can only ever chase one of them.
  function lineProbability(line) {
    let best = 0;
    for (let n = 1; n <= 20; n++) {
      let p = 1;
      for (const [r, c] of line.cells) {
        const die = grid[r][c];
        if (die.sides < n) { p = 0; break; }   // this die can never show n
        if (die.value !== n) p /= die.sides;   // needs a re-roll to get there
      }
      if (p > best) best = p;
    }
    return best;
  }

  // Claim the space the odds will need, before they exist. Same number of
  // entries, same shape, dummy numbers, made invisible by CSS — so the
  // layout around the board is identical before and after you answer.
  function reserveOdds() {
    const el = document.getElementById('odds');
    el.innerHTML = 'All ' + LINES.length + ': ' + LINES
      .map(l => '<span class="oddline"><b>' + l.key + '</b> 1 in 0,000</span>')
      .join('');
    el.classList.add('ghost');
  }

  function oneIn(p) {
    if (p === 0) return 'impossible';
    return '1 in ' + Math.round(1 / p).toLocaleString();
  }

  // Below 30px the "d20" label under each die stops being readable, so we
  // stop shrinking and let the page scroll instead. Above 68px it just looks
  // oversized, so it stops growing — 68 is what the desktop has always used.
  const CELL_MIN = 30, CELL_MAX = 68;

  const small = () => window.matchMedia('(max-width: 1024px)').matches;
  const landscape = () => window.matchMedia('(orientation: landscape)').matches;

  // Set the one --cell dial so the board is as big as it can be without
  // pushing anything off the screen.
  function fitBoard() {
    const root = document.documentElement;
    const board = document.getElementById('board');

    if (!small() || document.getElementById('game').hidden) {
      root.style.setProperty('--cell', CELL_MAX + 'px');
      return;
    }

    // The pinned bar's height, measured rather than guessed — a guess goes
    // stale the moment a label wraps onto a second line.
    const hudwrap = document.querySelector('.hudwrap');
    root.style.setProperty('--hud-space', hudwrap.offsetHeight + 'px');

    // Render the board at a known size and see what it actually costs, so
    // this keeps working even if the CSS proportions change later. Kept
    // small so the trial itself never overflows and disturbs what we are
    // about to measure.
    const TRIAL = 40;
    root.style.setProperty('--cell', TRIAL + 'px');
    const wPer = board.offsetWidth / TRIAL, hPer = board.offsetHeight / TRIAL;
    if (!wPer || !hPer) { root.style.setProperty('--cell', CELL_MAX + 'px'); return; }

    // Space comes from the page's own padding and the fixed pieces around
    // the board — never from where the board is sitting. Its position moves
    // with its size, which is the very thing being calculated.
    const bs = getComputedStyle(document.body);
    const padX = parseFloat(bs.paddingLeft) + parseFloat(bs.paddingRight);
    const padY = parseFloat(bs.paddingTop) + parseFloat(bs.paddingBottom);

    const title = document.querySelector('h1'), ts = getComputedStyle(title);
    const titleSpace = title.offsetHeight +
                       parseFloat(ts.marginTop) + parseFloat(ts.marginBottom);

    const info = document.querySelector('.info');
    const SAFETY = 6;

    // Landscape puts the info column beside the board; portrait puts it
    // below. The pinned HUD is already paid for by the body's padding.
    const availW = root.clientWidth - padX - SAFETY -
                   (landscape() ? info.offsetWidth + 10 : 0);
    const availH = root.clientHeight - padY - titleSpace - SAFETY -
                   (landscape() ? 0 : info.offsetHeight);

    const cell = Math.min(availW / wPer, availH / hPer);
    root.style.setProperty('--cell',
      Math.max(CELL_MIN, Math.min(CELL_MAX, Math.floor(cell))) + 'px');
  }

  window.addEventListener('resize', fitBoard);
  window.addEventListener('orientationchange', fitBoard);

  function draw() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    board.style.setProperty('--n', size);

    const place = (el, r, c) => {
      el.style.gridRow = r + 1;
      el.style.gridColumn = c + 1;
      board.appendChild(el);
    };

    const pickButton = (key, label) => {
      const b = document.createElement('button');
      b.className = 'pick';
      b.textContent = label;
      b.dataset.key = key;
      b.disabled = answered;
      b.onclick = () => choose(key);
      return b;
    };

    place(pickButton('D↘', '↘'), 0, 0);
    place(pickButton('D↙', '↙'), 0, size + 1);
    for (let c = 0; c < size; c++) place(pickButton('C' + (c + 1), '↓'), 0, c + 1);
    for (let r = 0; r < size; r++) place(pickButton('R' + (r + 1), '→'), r + 1, 0);

    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        const die = grid[r][c];
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.pos = r + ',' + c;
        cell.innerHTML = '<div class="value">' + die.value + '</div>' +
                         '<div class="sides">d' + die.sides + '</div>';
        place(cell, r + 1, c + 1);
      }
    }

    fitBoard();
  }

  function choose(key) {
    if (answered) return;
    answered = true;

    const scored = LINES.map(l => ({ line: l, p: lineProbability(l) }));
    const best = Math.max.apply(null, scored.map(s => s.p));
    const picked = scored.find(s => s.line.key === key);

    // Ties count as correct — more than one line can be equally good.
    const gotIt = picked.p >= best - 1e-12;
    if (gotIt) correct++;
    results[round - 1] = gotIt;

    const bestKeys = scored.filter(s => s.p >= best - 1e-12).map(s => s.line.key);

    document.querySelectorAll('button.pick').forEach(b => {
      b.disabled = true;
      if (b.dataset.key === key) b.classList.add('chosen');
      if (bestKeys.includes(b.dataset.key)) b.classList.add('best');
    });
    // Available straight away, so the reveal can be skipped.
    const next = document.getElementById('next');
    next.textContent = round >= TOTAL_ROUNDS ? 'See your final score' : 'Next board';
    next.hidden = false;

    const cellAt = (r, c) => document.querySelector('[data-pos="' + r + ',' + c + '"]');

    // Light your chosen line one die at a time — green if right, red if wrong.
    const STAGGER = 260;
    picked.line.cells.forEach(([r, c], i) => {
      pending.push(setTimeout(
        () => cellAt(r, c).classList.add('step', gotIt ? 'good' : 'bad'), i * STAGGER));
    });

    // Then show the line that actually was best, solid green.
    const runLength = picked.line.cells.length * STAGGER + 120;
    pending.push(setTimeout(() => {
      scored.find(s => s.line.key === bestKeys[0]).line.cells.forEach(([r, c]) => {
        const el = cellAt(r, c);
        el.classList.remove('bad', 'step');
        el.classList.add('win');
      });

      const oddsEl = document.getElementById('odds');
      oddsEl.innerHTML = 'All ' + LINES.length + ': ' + scored
        .sort((a, b) => b.p - a.p)
        .map(s => '<span class="oddline"><b>' + s.line.key + '</b> ' + oneIn(s.p) + '</span>')
        .join('');
      oddsEl.classList.remove('ghost');
    }, runLength));

    const result = document.getElementById('result');
    if (gotIt) {
      result.className = 'result right';
      result.textContent = 'Correct — ' + key + ' at ' + oneIn(picked.p) + ' is the best line.';
    } else {
      result.className = 'result wrong';
      result.textContent = 'Not quite — ' + key + ' is ' + oneIn(picked.p) +
                           '. Best was ' + bestKeys.join(' / ') + ' at ' + oneIn(best) + '.';
    }

    updateScore();
  }

  function drawPips(el) {
    el.innerHTML = '';
    for (let i = 0; i < TOTAL_ROUNDS; i++) {
      const p = document.createElement('div');
      p.className = 'pip' + (results[i] === true ? ' hit' : results[i] === false ? ' miss' : '');
      el.appendChild(p);
    }
  }

  function updateScore() {
    document.getElementById('roundNum').textContent = round + ' of ' + TOTAL_ROUNDS;
    document.getElementById('correctNum').textContent = correct;
    document.getElementById('boardNum').textContent = size + '×' + size;
    drawPips(document.getElementById('pips'));
  }

  function nextRound() {
    clearPending();
    if (round >= TOTAL_ROUNDS) { showFinal(); return; }
    const stepUp = stepUpMessage(round, round + 1);
    round++;
    answered = false;
    if (stepUp) toast(stepUp);
    document.getElementById('result').className = 'result';
    document.getElementById('result').textContent = '';
    document.getElementById('next').hidden = true;
    newGrid();
    reserveOdds();
    draw();
    updateScore();
  }

  // Built once, used for both the block on screen and the text that gets
  // copied — so the two can never drift apart.
  function shareParts() {
    const squares = results.map(r => r ? '🟩' : '🟥');
    const rows = [];
    for (let i = 0; i < squares.length; i += 6) rows.push(squares.slice(i, i + 6).join(''));
    return {
      head: 'Best Line — ' + correct + '/' + TOTAL_ROUNDS +
            (finalMs ? ' in ' + fmt(finalMs) : ''),
      rows: rows,
      url: SHARE_URL
    };
  }

  function shareText() {
    const p = shareParts();
    return [p.head].concat(p.rows, [p.url]).join('\n');
  }

  function renderShare() {
    const p = shareParts();
    const el = document.getElementById('share');
    el.innerHTML = '<div>' + p.head + '</div>' +
                   '<div class="squares">' + p.rows.join('<br>') + '</div>' +
                   '<div class="link">' + p.url + '</div>';
    // Screen readers announce this label instead of reading out twelve
    // colour names one at a time.
    el.setAttribute('aria-label', p.head);
    // Only offer Share where the browser actually has a share sheet.
    document.getElementById('shareBtn').hidden = !navigator.share;
    document.getElementById('copyBtn').textContent = 'Copy';
  }

  // The modern clipboard call needs a secure page (https). Opened straight
  // off your disk it may be missing, so fall back to the old way.
  function copyShare() {
    const text = shareText();
    const done = () => {
      const b = document.getElementById('copyBtn');
      b.textContent = 'Copied!';
      setTimeout(() => { b.textContent = 'Copy'; }, 1600);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallbackCopy);
    } else {
      fallbackCopy();
    }
    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { document.getElementById('copyBtn').textContent = 'Copy failed'; }
      document.body.removeChild(ta);
    }
  }

  function showFinal() {
    clearPending();
    hideToast();
    stopClock();
    document.getElementById('game').hidden = true;
    document.getElementById('final').hidden = false;
    document.body.classList.add('ended');
    finalMs = startMs === null ? 0 : Date.now() - startMs;
    document.getElementById('finalNum').textContent = correct;
    document.getElementById('finalTime').textContent =
      finalMs ? 'in ' + fmt(finalMs) : '';
    drawPips(document.getElementById('finalPips'));
    renderShare();
  }

  function restart() {
    clearPending();
    hideToast();
    stopClock();
    document.body.classList.remove('ended');
    startMs = null; finalMs = 0;
    showTime();
    round = 1; correct = 0; answered = false; results = [];
    document.getElementById('final').hidden = true;
    document.getElementById('startModal').hidden = false;
    document.getElementById('result').className = 'result';
    document.getElementById('result').textContent = '';
    document.getElementById('next').hidden = true;
    newGrid();
    reserveOdds();
    draw();
    updateScore();
  }

  // START is the starting gun: it reveals the board and begins the clock,
  // so the time never includes reading the rules.
  function beginPlay() {
    document.getElementById('startModal').hidden = true;
    document.getElementById('game').hidden = false;
    fitBoard();   // the board was dealt while hidden, so it needs sizing now
    startClock();
  }

  document.getElementById('startBtn').onclick = beginPlay;
  document.getElementById('next').onclick = nextRound;
  document.getElementById('playAgain').onclick = restart;
  document.getElementById('copyBtn').onclick = copyShare;
  document.getElementById('shareBtn').onclick = () => {
    // If you dismiss the share sheet the browser rejects — not an error.
    navigator.share({ title: 'Best Line', text: shareText() }).catch(() => {});
  };
  document.getElementById('finalOutOf').textContent =
    'correct out of ' + TOTAL_ROUNDS + ' boards';

  newGrid();
  reserveOdds();
  draw();
  updateScore();
</script>
